@if(eventResource.isLoading()){
<div class="event-page__loading">
  <div class="event-page__loading-spinner"></div>
  <p class="event-page__loading-text">Cargando Evento ...</p>
</div>
} @if(eventResource.hasValue()){
<app-event-detail [event]="eventResource.value()" />

@if(authService.authStatus() === 'authenticated'){
<div class="event-page__actions">
  <button class="event-page__link">Inscribirse</button>
</div>
}
<!--  -->
}
